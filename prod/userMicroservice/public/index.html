<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-update { background: #2196F3; color: white; display: none; }
        .btn-delete { background: #f44336; color: white; }
        .list-item { background: #f9f9f9; border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; }
        .list-actions { display: flex; gap: 5px; }
        .btn-edit { background: #FFC107; color: black; }
        .btn-del { background: #f44336; color: white; }
        
        /* Login UI Styles */
        .login-section { margin-top: 20px; padding: 15px; border: 1px dashed #ccc; border-radius: 8px; }
        .auth-btn { background: #9C27B0; color: white; margin-top: 10px; }
        
        /* New Error UI Styles */
        .error-ui {
            padding: 10px;
            background-color: #ffebee;
            border-left: 5px solid #f44336;
            color: #c62828;
            margin-bottom: 15px;
            display: none; /* Hidden by default */
            border-radius: 4px;
            font-weight: bold;
        }
        .error-ui.visible {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Error UI Container -->
        <div id="errorUI" class="error-ui">Error message will appear here</div>
        
        <!-- Login Section (New) -->
        <h2>User Login</h2>
        <div class="login-section">
            <p>Sign in to your account.</p>
            <button id="btnVerify" class="auth-btn" onclick="verifyUser()">Sign In</button>
        </div>

        <h2>Add/Update User</h2>
        
        <!-- Input Form -->
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter user email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="text" id="password" placeholder="Enter user password">
        </div>

        <div class="btn-group">
            <button id="btnSave" class="btn-save" onclick="saveUser()">+ Add New User</button>
            <button id="btnUpdate" class="btn-update" onclick="updateUser()">Update User</button>
            <button class="btn-delete" onclick="deleteUser(window.currentEditId)">Delete User</button>
        </div>

        <h2>Existing Users</h2>
        <div id="userList">
            <div class="list-item"><p>Loading users...</p></div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'http://localhost:3002/users';
        window.currentEditId = null;

        // Error UI Management
        function errorUI(text) {
            const errorElement = document.getElementById('errorUI');
            if (text) {
                errorElement.innerText = text;
                errorElement.classList.add('visible');
            } else {
                errorElement.classList.remove('visible');
            }
        }

        // Simplified Utility Function
        // Handles full fetch lifecycle: request -> response -> JSON parsing -> success/error callbacks
        const fetchApiJson = (path, method, data, onSuccess, onFail) => {
            fetch(API_URL + path, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: data ? JSON.stringify(data) : undefined
            })
            .then(res => res.json())
            .then(jsonData => {
                if(jsonData.isError){
                    // Show specific error from backend if available, otherwise generic
                    errorUI((jsonData.messages || []).join('\n') || 'An error occurred on the server');
                    if(onFail)onFail(jsonData);
                }else if (onSuccess) onSuccess(jsonData);
            })
            .catch(err => {
                // Network or parsing errors
                errorUI(err.message || 'Network error occurred');
                const debugData = { error: err.message };
                if (onFail) onFail(debugData);
            });
        };

        // Load users on startup
        document.addEventListener('DOMContentLoaded', loadUsers);

        // 1. CREATE / SAVE
        function saveUser() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!username || !email || !password) {
                errorUI('Please fill in all fields');
                return;
            }

            // Using fetchApiJson to handle the POST request
            fetchApiJson(
                '', // Path: '' results in '/users'
                'POST',
                { username, email, password }, // Data payload
                (data) => {
                    errorUI(''); // Clear error on success
                    alert(`Created: ${data.username}`);
                    clearForm();
                    loadUsers();
                },
                (err) => {
                    // Errors are handled by the fetchApiJson helper via errorUI()
                }
            );
        }

        // 2. READ / LOAD
        function loadUsers() {
            // Using fetchApiJson to handle the GET request
            fetchApiJson(
                '', // Path: '' results in '/users'
                'GET',
                null, // No data needed for GET
                (users) => {
                    const list = document.getElementById('userList');
                    
                    if (users.length === 0) {
                        list.innerHTML = '<div class="list-item"><p>No users found.</p></div>';
                        return;
                    }

                    // Updated template to show username instead of 'name'
                    list.innerHTML = users.map(u => `
                        <div class="list-item">
                            <div>
                                <strong>${u.username}</strong> (${u.email})
                                <br><small>${u.password}</small>
                            </div>
                            <div class="list-actions">
                                <button class="btn-edit" onclick="editUser('${u.username}', '${u.username}', '${u.email}', '${u.password}')">Edit</button>
                                <button class="btn-del" onclick="deleteUser('${u.username}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
                },
                (err) => {
                    // Errors are handled by the fetchApiJson helper via errorUI()
                    console.error('Load error:', err);
                    document.getElementById('userList').innerHTML = '<div class="list-item"><p>Error loading users.</p></div>';
                }
            );
        }

        // 3. UPDATE / PREPARE EDIT
        function editUser(id, username, email, password) {
            // Set ID to delete/update
            window.currentEditId = username;

            document.getElementById('username').value = username;
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            
            // Switch buttons
            document.getElementById('btnSave').style.display = 'none';
            document.getElementById('btnUpdate').style.display = 'block';
            document.getElementById('btnDelete').style.display = 'block';            
        }

        // 4. UPDATE / SAVE CHANGES
        function updateUser() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            window.currentEditId = username;

            if (!username || !email || !password) {
                errorUI('Fill in details');
                return;
            }

            // Using fetchApiJson to handle the PUT request
            fetchApiJson(
                `/${window.currentEditId}`, // Path: '/username'
                'PUT',
                { username, email, password }, // Data payload
                (data) => {
                    errorUI(''); // Clear error on success
                    alert(`Updated: ${data.username}`);
                    clearForm();
                    loadUsers();
                },
                (err) => {
                    // Errors are handled by the fetchApiJson helper via errorUI()
                    console.error(err);
                }
            );
        }

        // 5. DELETE
        function deleteUser(id) {
            const user = confirm('Are you sure you want to delete this user?');
            if (!user) return;

            // Using fetchApiJson to handle the DELETE request
            fetchApiJson(
                `/${id}`, // Path: '/username'
                'DELETE',
                null, // No data needed for DELETE
                (res) => {
                    if (res.ok) {
                        errorUI(''); // Clear error on success
                        alert('Deleted!');
                        // If we deleted the one we're currently editing, clear form
                        if (window.currentEditId === id) {
                            clearForm();
                            window.currentEditId = null;
                        }
                        loadUsers();
                    }
                },
                (err) => {
                    // Errors are handled by the fetchApiJson helper via errorUI()
                    console.error(err);
                }
            );
        }

        // Helper: Clear Form
        function clearForm() {
            document.getElementById('username').value = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('btnSave').style.display = 'block';
            document.getElementById('btnUpdate').style.display = 'none';
            window.currentEditId = null;
            errorUI(''); // Ensure error UI is cleared when form is reset
        }

        // 6. VERIFY USER (New Logic)
        function verifyUser() {
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            if (!usernameInput || !passwordInput) {
                errorUI('Please enter both Username and Password');
                return;
            }

            // Using fetchApiJson to handle the POST request for verification
            fetchApiJson(
                '/verify', // Path: '/verify' results in '/users/verify'
                'POST',
                { username: usernameInput, password: passwordInput }, 
                (data) => {
                    errorUI(''); // Clear error on success
                    alert(`Login Successful! Welcome, ${data.username}`);
                    loadUsers(); // Refresh list to show the user
                },
                (err) => {
                    // Errors are handled by the fetchApiJson helper via errorUI()
                    console.error(err);
                    if(err && err.messages) {
                        alert('Invalid Username or Password');
                    } else {
                        alert('Login Failed. Please check credentials.');
                    }
                }
            );
        }
    </script>
</body>
</html>
